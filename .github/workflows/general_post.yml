name: 일반 소재 스레드 자동 게시 (하루 3회)

on:
  schedule:
    # 아래 시간은 모두 UTC 기준입니다 (KST = UTC+9)
    - cron: "0 21 * * *"   # 매일 06:00 KST
    - cron: "0 6 * * *"    # 매일 15:00 KST
    - cron: "0 12 * * *"   # 매일 21:00 KST
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 테스트용

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (나눔고딕)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 의존 패키지 설치
        run: pip install -r requirements.txt

      - name: 1단계 - 콘텐츠/이미지 생성
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python generate_general_post_prepare.py

      - name: 2단계 - 생성된 이미지/기록 커밋 & 푸시
        run: |
          git config user.name "milkyway-bot"
          git config user.email "milkyway-bot@users.noreply.github.com"
          git add data/used_topics.json output/
          git commit -m "chore: 일반 스레드 자동 생성 $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "변경 사항 없음"
          git push

      - name: 3단계 - Threads에 게시
        working-directory: scripts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python generate_general_post_publish.py
